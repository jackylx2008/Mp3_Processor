[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3-processor"
version = "0.2.0"
description = "Configurable batch audio processing workflows"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "mutagen>=1.47",
  "Pillow>=10.0",
  "pydub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flake8>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
